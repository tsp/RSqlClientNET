name: R CMD check (no database)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Test both native Apple Silicon and Intel rather than relying on
        # the moving macos-latest image.
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      NOT_CRAN: "true"
      RSQLCLIENTNET_RUN_DBITEST: "0"
      RSQLCLIENTNET_AUTO_INSTALL_DEPS: "0"
      # Avoid .NET runtime diagnostic sockets in R CMD check's monitored TMPDIR.
      # Do not set this for ordinary users who need dotnet debugging tools.
      DOTNET_EnableDiagnostics_IPC: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install checkbashisms (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y devscripts
      - name: Install checkbashisms (macOS)
        if: runner.os == 'macOS'
        run: brew install checkbashisms
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::callr
            any::roxygen2
          needs: check
      - name: "macOS preflight: native R compiler and dotnet"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uname -m
          Rscript -e 'cat("R architecture:", R.version$arch, "\n")'
          xcrun --find clang++
          dotnet --info
          dotnet --list-runtimes
      - name: "macOS smoke: install and start helper"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript -e 'library(RSqlClientNET); p <- sql_ping(); print(p); stopifnot(isTRUE(p$ok), identical(p$reply, "pong"))'
      - name: Validate generated Rd and namespace
        shell: Rscript {0}
        run: |
          source("tools/document.R")
      - uses: r-lib/actions/check-r-package@v2
